name: "Build & test (Makefile: c_examples + java_examples)"

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build and run examples
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      # Set to 'true' to force rebuild of libbson even if cache exists (can be overridden by .env)
      FORCE_REBUILD: 'false'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Load .env file
        run: |
          ENV_PATH=".github/workflows/.env"
          if [ -f "$ENV_PATH" ]; then
            echo "Loading $ENV_PATH into environment (GITHUB_ENV)"
            # Skip empty lines and comments, append VAR=VAL lines to GITHUB_ENV
            grep -v '^[[:space:]]*#' "$ENV_PATH" | grep -v '^[[:space:]]*$' \
              | while IFS= read -r line; do echo "$line" >> $GITHUB_ENV; done
          else
            echo "$ENV_PATH not found; skipping"
          fi

      - name: Show environment
        run: |
          echo "Runner: $RUNNER_OS"
          nproc --all || true
          uname -a
          free -m || true
          java -version || true
          mvn -v || true

      - name: Cache Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-

      - name: Setup ccache and install build deps (includes OpenJDK 11)
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config cmake libssl-dev default-jdk maven ccache openjdk-11-jdk git ca-certificates python3
          # Increase ccache size (optional)
          ccache --max-size=5G || true

      - name: Restore prebuilt libbson (cache)
        id: libbson-cache
        uses: actions/cache@v4
        with:
          # Ajuste estes paths para os arquivos/fonte que compõem o libbson/mongo-c-driver no seu repo.
          # Inclua um arquivo de versão (core/libbson.version) para controlar quando invalidar o cache.
          key: ${{ runner.os }}-libbson-${{ hashFiles('vendor/libbson/**', 'vendor/mongo-c-driver/**', 'core/libbson.version') }}
          path: |
            core/lib
            core/include
            ~/.ccache

      - name: Show restored libbson state (debug)
        run: |
          echo "Cache hit? ${{ steps.libbson-cache.outputs.cache-hit }}"
          echo "core/lib listing:"
          ls -la core/lib || true
          echo "core/include listing:"
          ls -la core/include || true

      - name: Build libbson (only on cache miss or forced)
        if: steps.libbson-cache.outputs.cache-hit != 'true' || env.FORCE_REBUILD == 'true'
        run: |
          set -o pipefail
          echo "Cache miss or forced rebuild: building libbson/mongoc..."
          # Garantir ccache no PATH e compilers canônicos
          export PATH="/usr/lib/ccache:$PATH"
          export CC=gcc
          export CXX=g++
          export CCACHE_DIR="${HOME}/.ccache"
          mkdir -p "$CCACHE_DIR"
          # Comando para compilar/install do libbson (ajuste se necessário)
          make install_bson 2>&1 | tee install_bson.log

      - name: Upload install_bson log (only when built)
        if: steps.libbson-cache.outputs.cache-hit != 'true' || env.FORCE_REBUILD == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: install-bson-log
          path: install_bson.log

      - name: Determine parallel jobs (-j)
        id: jobs
        run: |
          N=$(nproc --all || echo 2)
          if [ "$N" -gt 1 ]; then JOBS=$((N-1)); else JOBS=1; fi
          echo "Determined nproc=$N, using JOBS=$JOBS"
          echo "JOBS=$JOBS" >> $GITHUB_OUTPUT

      - name: Build and run c_examples + java_examples (streamed, logged)
        run: |
          set -o pipefail

          # Detect JAVA_HOME (works quando javac está instalado)
          if which javac >/dev/null 2>&1; then
            JAVA_HOME="$(dirname $(dirname $(readlink -f $(which javac))))"
            echo "Detected JAVA_HOME=$JAVA_HOME"
            export JAVA_HOME

            JNI_INC1="$JAVA_HOME/include"
            JNI_INC2="$JAVA_HOME/include/linux"
            echo "Using JNI includes: $JNI_INC1 and $JNI_INC2"

            # Export flags so Makefile picks up the JNI headers if it doesn't use JAVA_HOME
            export CFLAGS="${CFLAGS} -I${JNI_INC1} -I${JNI_INC2}"
            export CXXFLAGS="${CXXFLAGS} -I${JNI_INC1} -I${JNI_INC2}"
            export CPPFLAGS="${CPPFLAGS} -I${JNI_INC1} -I${JNI_INC2}"
          else
            echo "javac not found in PATH; JNI includes will not be set"
          fi

          # Ensure ccache wrapper is used via PATH and compilers are canonical names
          export PATH="/usr/lib/ccache:$PATH"
          export CC=gcc
          export CXX=g++

          export CCACHE_DIR="${HOME}/.ccache"
          mkdir -p "$CCACHE_DIR"

          JOBS=${{ steps.jobs.outputs.JOBS }}
          echo "Preparing target directories and debug listing..."
          # Garantir que o diretório destino para o .so exista
          mkdir -p wrappers/java/src/main/resources
          echo "PWD: $(pwd)"
          ls -la wrappers || true
          ls -la wrappers/java || true
          ls -la wrappers/java/src || true
          ls -la wrappers/java/src/main || true
          ls -la wrappers/java/src/main/resources || true

          echo "Running: make -j$JOBS c_examples java_examples"
          # stdbuf for line-buffering; tee streams to UI and saves build.log
          stdbuf -oL -eL make -j"$JOBS" c_examples java_examples 2>&1 | tee build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            wrappers/java/*.so
            **/target/*.jar
            core/lib/**
            core/include/**
            test-results/**

      - name: Print wrappers/java listing
        if: always()
        run: |
          echo "Listing wrappers/java:"
          ls -la wrappers/java || true

      - name: ccache stats (helpful to evaluate cache effectiveness)
        if: always()
        run: |
          echo "ccache stats:"
          ccache -s || true

      - name: Setup .NET 8.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Run .NET unit tests
        run: |
          echo "Compiling C library wrapper for .NET 8.0.x"
          make -j$JOBS cs
          echo "Running .NET 8.0 unit tests..."
          cd wrapper/dotNET/W21CSparser
          dotnet test --logger "console;verbosity=detailed" 2>&1 | tee dotnet-test.log

     - name: Upload .NET test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-test-log
          path: wrapper/dotNET/W21CSparser/dotnet-test.log

