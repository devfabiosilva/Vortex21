name: "Build & test (Makefile: c_examples + java_examples)"

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  build-and-test:
    name: Build and run examples
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Show environment
        run: |
          echo "Runner: $RUNNER_OS"
          nproc --all || true
          uname -a
          free -m || true
          java -version || true
          mvn -v || true

      - name: Cache Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-

      - name: Setup ccache and install build deps (includes OpenJDK 11)
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config cmake libssl-dev default-jdk maven ccache openjdk-11-jdk
          # Increase ccache size (optional)
          ccache --max-size=5G || true

      - name: Cache compiled core and ccache
        id: cache-core
        uses: actions/cache@v4
        with:
          # Ajuste 'path/to/witsml21C.c' para o caminho real do arquivo se desejar invalidar cache quando ele mudar.
          key: ${{ runner.os }}-core-${{ hashFiles('core/**', 'wrappers/java/**', 'path/to/witsml21C.c') }}
          path: |
            core/lib
            core/include
            ~/.ccache

      - name: Determine parallel jobs (-j)
        id: jobs
        run: |
          N=$(nproc --all || echo 2)
          if [ "$N" -gt 1 ]; then JOBS=$((N-1)); else JOBS=1; fi
          echo "Determined nproc=$N, using JOBS=$JOBS"
          echo "JOBS=$JOBS" >> $GITHUB_OUTPUT

      - name: Build and run c_examples + java_examples (streamed, logged)
        run: |
          set -o pipefail

          # Detect JAVA_HOME (works quando javac está instalado)
          if which javac >/dev/null 2>&1; then
            JAVA_HOME="$(dirname $(dirname $(readlink -f $(which javac))))"
            echo "Detected JAVA_HOME=$JAVA_HOME"
            export JAVA_HOME

            JNI_INC1="$JAVA_HOME/include"
            JNI_INC2="$JAVA_HOME/include/linux"
            echo "Using JNI includes: $JNI_INC1 and $JNI_INC2"

            # Export flags so Makefile picks up the JNI headers if it doesn't use JAVA_HOME
            export CFLAGS="${CFLAGS} -I${JNI_INC1} -I${JNI_INC2}"
            export CXXFLAGS="${CXXFLAGS} -I${JNI_INC1} -I${JNI_INC2}"
            export CPPFLAGS="${CPPFLAGS} -I${JNI_INC1} -I${JNI_INC2}"
          else
            echo "javac not found in PATH; JNI includes will not be set"
          fi

          # Ensure ccache wrapper is used via PATH and compilers are canonical names
          export PATH="/usr/lib/ccache:$PATH"
          export CC=gcc
          export CXX=g++

          export CCACHE_DIR="${HOME}/.ccache"
          mkdir -p "$CCACHE_DIR"

          JOBS=${{ steps.jobs.outputs.JOBS }}
          echo "Running: make -j$JOBS c_examples java_examples"

          # stdbuf for line-buffering; tee streams to UI and saves build.log
          stdbuf -oL -eL make -j"$JOBS" c_examples java_examples 2>&1 | tee build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            wrappers/java/*.so
            **/target/*.jar
            core/lib/**
            core/include/**
            test-results/**

      - name: Print wrappers/java listing
        if: always()
        run: |
          echo "Listing wrappers/java:"
          ls -la wrappers/java || true
